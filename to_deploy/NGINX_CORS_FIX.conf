# ============================================================
# AMSH Nginx /uploads FIX (Updated)
# ============================================================
# Add these blocks to api.amsh.gov.et > Apache & Nginx Settings > "Additional nginx directives"

# 1. ALLOW LARGE UPLOADS (Fixes "not working" on phone/large photos)
client_max_body_size 100M;

# 2. SERVE UPLOADS DIRECTLY (Fixes 404 Not Found)
location /uploads/ {
    # CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS, HEAD' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Range' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range' always;
    add_header 'Cross-Origin-Resource-Policy' 'cross-origin' always;

    # Performance
    expires 30d;
    add_header Cache-Control "public, no-transform";

    # Handle OPTIONS preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # CRITICAL: Check your app's startup logs to find the exact path.
    # Look for "📂 AMSH Storage: Uploads pointing to: ..." in your Node.js console.
    # Use that path here. 
    # Example for Plesk: /var/www/vhosts/amsh.gov.et/api.amsh.gov.et/backend/storage/uploads/
    
    alias /var/www/vhosts/amsh.gov.et/api.amsh.gov.et/backend/storage/uploads/;
    
    # Try reading the file directly, fallback to 404
    try_files $uri $uri/ =404;
}
